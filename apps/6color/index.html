<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>6 Color Light Control</title>
  <link rel="stylesheet" href="./styles.css?v=d55e1ba3d30a">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <h1>6 Color Light Control</h1>
        <p id="deviceName" class="subtle">BLE NUS</p>
      </div>
      <div class="connection">
        <span id="connectionDot" class="dot"></span>
        <span id="connectionText">Disconnected</span>
        <button id="connectButton" class="primary-button" type="button">
          <span class="button-icon">BLE</span>
          Connect
        </button>
      </div>
    </header>

    <nav class="mode-tabs" aria-label="Control mode">
      <button id="manualTabButton" class="tab-button" type="button" aria-selected="true">Manual</button>
      <button id="timelineTabButton" class="tab-button" type="button" aria-selected="false">Timeline</button>
      <button id="blocksTabButton" class="tab-button" type="button" aria-selected="false">Protocols</button>
    </nav>

    <section id="manualPanel" class="tab-panel is-active">
      <section class="command-bar">
        <button id="getButton" type="button">GET</button>
        <button id="allOnButton" type="button">ALL ON</button>
        <button id="allOffButton" type="button">ALL OFF</button>
        <button id="allMaxButton" type="button">ALL 100%</button>
        <div class="manual-command">
          <input id="manualInput" type="text" autocomplete="off" spellcheck="false" placeholder="SET,R,1,800">
          <button id="sendManualButton" type="button">SEND</button>
        </div>
      </section>

      <section id="channelGrid" class="channel-grid" aria-label="Channel controls"></section>
    </section>

    <section id="timelinePanel" class="tab-panel" hidden>
      <div class="timeline-layout">
        <section class="timeline-editor" aria-label="Timeline event editor">
          <div class="timeline-toolbar">
            <button id="addTimelineRowButton" type="button">Add Row</button>
            <button id="sortTimelineRowsButton" type="button">Sort</button>
            <button id="clearTimelineRowsButton" type="button">Clear</button>
            <button id="importTimelineCsvButton" type="button">Import CSV</button>
            <button id="exportTimelineCsvButton" type="button">Export CSV</button>
            <button id="runTimelineButton" class="primary-button" type="button">Run</button>
            <button id="stopTimelineButton" type="button">Stop</button>
            <input id="timelineCsvInput" type="file" accept=".csv,.scv,text/csv" hidden>
          </div>

          <div class="timeline-protocol-insert">
            <label>
              <span>Protocol</span>
              <select id="timelineProtocolSelect"></select>
            </label>
            <label>
              <span>Start ms</span>
              <input id="timelineProtocolStartInput" type="number" min="0" step="1" value="0">
            </label>
            <button id="addProtocolToTimelineButton" type="button">Add Protocol</button>
          </div>

          <div class="timeline-table" role="table" aria-label="Timeline program rows">
            <div class="timeline-table-head" role="row">
              <span role="columnheader">Time ms</span>
              <span role="columnheader">Color</span>
              <span role="columnheader">Brightness</span>
              <span role="columnheader">Del</span>
            </div>
            <div id="timelineRows" class="timeline-rows" role="rowgroup"></div>
          </div>
        </section>

        <section class="timeline-plot-panel" aria-label="Timeline event plot">
          <div class="plot-head">
            <span>Event Timeline</span>
            <span id="timelineDuration">0 ms</span>
          </div>
          <svg id="timelinePlot" class="timeline-plot" viewBox="0 0 820 260" role="img" aria-label="Brightness over time"></svg>
        </section>
      </div>
    </section>

    <section id="blocksPanel" class="tab-panel" hidden>
      <div class="timeline-layout">
        <section class="timeline-editor" aria-label="Protocol block editor">
          <div class="timeline-toolbar">
            <button id="addTimelineBlockButton" type="button">Add Block</button>
            <button id="sortTimelineBlocksButton" type="button">Sort</button>
            <button id="clearTimelineBlocksButton" type="button">Clear</button>
            <button id="importProtocolCsvButton" type="button">Import CSV</button>
            <button id="exportProtocolCsvButton" type="button">Export CSV</button>
            <button id="runBlocksButton" class="primary-button" type="button">Run</button>
            <button id="stopBlocksButton" type="button">Stop</button>
            <input id="protocolCsvInput" type="file" accept=".csv,.scv,text/csv" hidden>
          </div>

          <div class="digital-protocol" aria-label="Digital pulse generator">
            <div class="protocol-grid">
              <label class="protocol-wide">
                <span>Name</span>
                <input id="digitalNameInput" type="text" autocomplete="off" spellcheck="false" value="A5_OOK">
              </label>
              <label>
                <span>Channel</span>
                <select id="digitalChannelInput"></select>
              </label>
              <label>
                <span>Format</span>
                <select id="digitalFormatInput">
                  <option value="bin">Binary</option>
                  <option value="hex" selected>Hex</option>
                </select>
              </label>
              <label>
                <span>Width</span>
                <select id="digitalWidthInput">
                  <option value="4">4 bit</option>
                  <option value="8" selected>8 bit</option>
                </select>
              </label>
              <label>
                <span>Encoding</span>
                <select id="digitalEncodingInput">
                  <option value="ook">OOK NRZ</option>
                  <option value="manchester">Manchester</option>
                  <option value="pulse-width">Pulse Width</option>
                </select>
              </label>
              <label class="protocol-wide">
                <span>Data</span>
                <input id="digitalDataInput" type="text" autocomplete="off" spellcheck="false" value="A5">
              </label>
              <label>
                <span>Start delay ms</span>
                <input id="digitalStartInput" type="number" min="0" step="1" value="0">
              </label>
              <label>
                <span>Period ms</span>
                <input id="digitalBitMsInput" type="number" min="1" step="1" value="200">
              </label>
              <label>
                <span>Pulse width ms</span>
                <input id="digitalGapMsInput" type="number" min="1" step="1" value="200">
              </label>
              <label>
                <span>Amplitude</span>
                <input id="digitalBrightnessInput" type="number" min="1" max="1000" step="10" value="1000">
              </label>
            </div>
            <div class="protocol-actions">
              <button id="generateDigitalBlocksButton" type="button">Generate</button>
              <button id="appendDigitalBlocksButton" type="button">Append</button>
              <button id="runDigitalBlocksButton" class="primary-button" type="button">Generate + Run</button>
            </div>
            <output id="digitalPreviewOutput" class="protocol-output"></output>
          </div>

          <div class="clip-editor">
            <div class="editor-title">Selected Block</div>
            <label>
              <span>Channel</span>
              <select id="clipColorInput"></select>
            </label>
            <label>
              <span>Start ms</span>
              <input id="clipStartInput" type="number" min="0" step="1">
            </label>
            <label>
              <span>Duration ms</span>
              <input id="clipDurationInput" type="number" min="1" step="1">
            </label>
            <label>
              <span>Brightness</span>
              <input id="clipBrightnessInput" type="number" min="0" max="1000" step="10">
            </label>
            <button id="deleteTimelineBlockButton" class="danger-button" type="button">Delete Block</button>
          </div>

          <div class="editor-title">Generated Blocks</div>
          <div id="clipList" class="clip-list" aria-label="Timeline blocks"></div>
        </section>

        <section class="timeline-plot-panel" aria-label="Protocol waveform">
          <div class="plot-head">
            <span>Protocol Waveform</span>
            <span id="blockTimelineDuration">0 ms</span>
          </div>
          <div id="protocolParameterList" class="parameter-list" aria-label="Protocol parameters"></div>
          <svg id="protocolTermDiagram" class="term-diagram" viewBox="0 0 820 220" role="img" aria-label="Protocol pulse terminology diagram"></svg>
          <div id="blockTimelineRuler" class="timeline-ruler"></div>
          <div id="clipTimeline" class="clip-timeline" aria-label="Protocol block lanes"></div>
          <div class="plot-head plot-head-secondary">
            <span>Pulse Wave Preview</span>
            <span>0-1000</span>
          </div>
          <svg id="blockPreviewPlot" class="timeline-plot" viewBox="0 0 820 260" role="img" aria-label="Block brightness over time"></svg>
        </section>
      </div>
    </section>

    <section class="terminal">
      <div class="terminal-head">
        <span>BLE Log</span>
        <button id="clearLogButton" type="button">Clear</button>
      </div>
      <pre id="logOutput"></pre>
    </section>
  </main>

  <template id="channelTemplate">
    <article class="channel-card">
      <div class="channel-head">
        <div class="color-chip"></div>
        <div>
          <h2 class="channel-name"></h2>
          <p class="channel-state"></p>
        </div>
      </div>

      <div class="control-row">
        <span>Light</span>
        <button class="toggle-button onoff-button" type="button" aria-pressed="true"></button>
      </div>

      <div class="control-row">
        <span>ADIM PWM</span>
        <button class="toggle-button pwm-button" type="button" aria-pressed="true"></button>
      </div>

      <label class="slider-block">
        <span>Dimming <output class="duty-output"></output></span>
        <input class="duty-slider" type="range" min="0" max="1000" step="10">
      </label>

      <div class="quick-actions">
        <button class="quick-button" type="button" data-duty="0">0</button>
        <button class="quick-button" type="button" data-duty="250">25</button>
        <button class="quick-button" type="button" data-duty="500">50</button>
        <button class="quick-button" type="button" data-duty="750">75</button>
        <button class="quick-button" type="button" data-duty="1000">100</button>
      </div>

      <div class="pulse-panel">
        <div class="control-row">
          <span>Pulse</span>
          <button class="toggle-button pulse-button" type="button" aria-pressed="false"></button>
        </div>
        <div class="pulse-times">
          <label>
            <span>ON us</span>
            <input class="pulse-on-input" type="number" min="100" max="60000000" step="10">
          </label>
          <label>
            <span>OFF us</span>
            <input class="pulse-off-input" type="number" min="100" max="60000000" step="10">
          </label>
        </div>
        <button class="pulse-apply-button" type="button">Apply Pulse</button>
      </div>
    </article>
  </template>

  <script src="./app.js?v=a6b28e125243"></script>
</body>
</html>
