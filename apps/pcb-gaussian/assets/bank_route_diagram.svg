<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1180" viewBox="0 0 1900 1180">
  <defs>
    <style>
      .bg { fill: #f7f7f7; }
      .paper { fill: #ffffff; stroke: #cfd6d8; stroke-width: 2; }
      .title { font-family: "Segoe UI", "Malgun Gothic", Arial, sans-serif; font-size: 42px; font-weight: 300; fill: #3d3d3d; }
      .subtitle { font-family: "Segoe UI", "Malgun Gothic", Arial, sans-serif; font-size: 19px; fill: #666; }
      .head { font-family: "Segoe UI", "Malgun Gothic", Arial, sans-serif; font-size: 22px; font-weight: 800; fill: #111; }
      .small { font-family: "Segoe UI", "Malgun Gothic", Arial, sans-serif; font-size: 15px; fill: #333; }
      .tiny { font-family: "Segoe UI", "Malgun Gothic", Arial, sans-serif; font-size: 12px; fill: #333; }
      .mono { font-family: Consolas, "Cascadia Mono", monospace; font-size: 14px; fill: #111; }
      .mono-muted { font-family: Consolas, "Cascadia Mono", monospace; font-size: 12px; fill: #666; }
      .box { fill: #fff; stroke: #111; stroke-width: 2; }
      .box-soft { fill: #f7faf9; stroke: #8fa1a5; stroke-width: 1.8; }
      .bank-left { fill: #ecfff3; stroke: #2b8a4a; stroke-width: 2.2; }
      .bank-right { fill: #eef1ff; stroke: #4a57b8; stroke-width: 2.2; }
      .chip { fill: #fff; stroke: #111; stroke-width: 1.8; }
      .dacbox { fill: #fff; stroke: #111; stroke-width: 2.2; }
      .muxbox { fill: #fff8f8; stroke: #111; stroke-width: 2; }
      .tiabox { fill: #ffffff; stroke: #111; stroke-width: 2; }
      .arrowbox { fill: #ffffff; stroke: #111; stroke-width: 2; }
      .line { fill: none; stroke: #111; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .line-soft { fill: none; stroke: #98a5a8; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .dac-line { fill: none; stroke: #f08a24; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arr-dac); }
      .prog-line { fill: none; stroke: #cf4050; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arr-prog); }
      .adc-line { fill: none; stroke: #1f9b8e; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arr-adc); }
      .uart-line { fill: none; stroke: #174b7a; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arr-uart); }
      .rail-dac { fill: none; stroke: #f08a24; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .rail-prog { fill: none; stroke: #cf4050; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 5 5; }
      .rail-adc { fill: none; stroke: #1f9b8e; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .dot-dac { fill: #f08a24; }
      .dot-prog { fill: #cf4050; }
      .dot-adc { fill: #1f9b8e; }
      .tag-dac { fill: #fff2df; stroke: #f08a24; stroke-width: 1.5; }
      .tag-prog { fill: #fff0f2; stroke: #cf4050; stroke-width: 1.5; }
      .tag-adc { fill: #eaf8f6; stroke: #1f9b8e; stroke-width: 1.5; }
    </style>
    <marker id="arr-dac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0 1 L8 5 L0 9 Z" fill="#f08a24"/>
    </marker>
    <marker id="arr-prog" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0 1 L8 5 L0 9 Z" fill="#cf4050"/>
    </marker>
    <marker id="arr-adc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0 1 L8 5 L0 9 Z" fill="#1f9b8e"/>
    </marker>
    <marker id="arr-uart" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto">
      <path d="M0 1 L8 5 L0 9 Z" fill="#174b7a"/>
    </marker>

    <symbol id="gaussian-device" viewBox="0 0 86 82">
      <rect class="chip" x="4" y="4" width="78" height="74" rx="6"/>
      <path d="M 13 55 C 26 55, 25 18, 43 18 C 61 18, 60 55, 73 55" fill="none" stroke="#111" stroke-width="2"/>
      <line x1="12" y1="64" x2="74" y2="64" stroke="#111" stroke-width="1.7"/>
      <line x1="18" y1="6" x2="18" y2="0" stroke="#f08a24" stroke-width="2"/>
      <line x1="43" y1="78" x2="43" y2="82" stroke="#1f9b8e" stroke-width="2"/>
      <line x1="68" y1="6" x2="68" y2="0" stroke="#cf4050" stroke-width="2"/>
    </symbol>

    <symbol id="tia" viewBox="0 0 150 80">
      <polygon class="tiabox" points="0,0 0,80 98,40"/>
      <text class="mono" x="18" y="33">-</text>
      <text class="mono" x="18" y="62">+</text>
      <path d="M 32 12 H 72" class="line-soft"/>
      <path d="M 36 12 V -10 H 68 V 12" fill="none" stroke="#777" stroke-width="1.6"/>
      <text class="tiny" x="36" y="-14">1 MΩ</text>
    </symbol>
  </defs>

  <rect class="bg" width="1900" height="1180"/>
  <text class="title" x="62" y="72">Two-channel Gaussian control route</text>
  <line x1="650" y1="58" x2="1810" y2="58" stroke="#a6a6a6" stroke-width="3"/>
  <text class="subtitle" x="66" y="112">Left / Right 8-device banks with shared VG1, programmable A-μ, and jumper-selected TIA readout</text>

  <rect class="paper" x="58" y="150" width="1784" height="930"/>

  <!-- controller strip -->
  <g id="controller" transform="translate(96 188)">
    <rect class="box" x="0" y="0" width="235" height="94" rx="0"/>
    <text class="head" x="28" y="36">Web GUI</text>
    <text class="small" x="28" y="63">Web Serial command</text>
    <path class="uart-line" d="M 235 47 H 342"/>

    <rect class="box" x="342" y="0" width="260" height="94" rx="0"/>
    <text class="head" x="396" y="36">nRF52832</text>
    <text class="small" x="390" y="63">UART · SPI · GPIO · SAADC</text>

    <path class="dac-line" d="M 602 30 H 750"/>
    <path class="prog-line" d="M 602 64 H 750"/>

    <rect class="dacbox" x="750" y="-12" width="180" height="78"/>
    <text class="head" x="794" y="18">AD5322</text>
    <text class="small" x="780" y="43">DAC1 / DAC2</text>
    <path class="dac-line" d="M 930 27 H 1042"/>

    <rect class="box-soft" x="1042" y="-12" width="142" height="78"/>
    <text class="head" x="1072" y="18">Amp</text>
    <text class="small" x="1068" y="43">VG1 gain</text>

    <rect class="muxbox" x="750" y="88" width="180" height="78"/>
    <text class="head" x="790" y="118">MAX4581</text>
    <text class="small" x="774" y="143">CS selector</text>
    <path class="prog-line" d="M 930 127 H 1042"/>

    <rect class="muxbox" x="1042" y="88" width="176" height="78"/>
    <text class="head" x="1084" y="118">MAX5488</text>
    <text class="small" x="1076" y="143">A / μ digipots</text>
  </g>

  <!-- bank panels -->
  <g id="left-bank" transform="translate(96 420)">
    <rect class="bank-left" x="0" y="0" width="800" height="520"/>
    <text class="head" x="28" y="42">LEFT BANK · D1-D8</text>
    <text class="small" x="28" y="70">DAC1 drives shared VG1_L. Device A_i and μ_i are programmed individually.</text>

    <rect class="tag-dac" x="28" y="100" width="130" height="42"/>
    <text class="mono" x="52" y="127">VG1_L</text>
    <line class="rail-dac" x1="158" y1="121" x2="715" y2="121"/>

    <line class="rail-prog" x1="48" y1="168" x2="715" y2="168"/>
    <text class="mono-muted" x="52" y="158">A_i / μ_i program bus</text>

    <g transform="translate(70 185)">
      <use href="#gaussian-device" x="0" y="0"/><text class="mono" x="28" y="103">D1</text>
      <use href="#gaussian-device" x="88" y="0"/><text class="mono" x="116" y="103">D2</text>
      <use href="#gaussian-device" x="176" y="0"/><text class="mono" x="204" y="103">D3</text>
      <use href="#gaussian-device" x="264" y="0"/><text class="mono" x="292" y="103">D4</text>
      <use href="#gaussian-device" x="352" y="0"/><text class="mono" x="380" y="103">D5</text>
      <use href="#gaussian-device" x="440" y="0"/><text class="mono" x="468" y="103">D6</text>
      <use href="#gaussian-device" x="528" y="0"/><text class="mono" x="556" y="103">D7</text>
      <use href="#gaussian-device" x="616" y="0"/><text class="mono" x="644" y="103">D8</text>
      <line class="rail-adc" x1="43" y1="82" x2="43" y2="132"/>
      <line class="rail-adc" x1="131" y1="82" x2="131" y2="132"/>
      <line class="rail-adc" x1="219" y1="82" x2="219" y2="132"/>
      <line class="rail-adc" x1="307" y1="82" x2="307" y2="132"/>
      <line class="rail-adc" x1="395" y1="82" x2="395" y2="132"/>
      <line class="rail-adc" x1="483" y1="82" x2="483" y2="132"/>
      <line class="rail-adc" x1="571" y1="82" x2="571" y2="132"/>
      <line class="rail-adc" x1="659" y1="82" x2="659" y2="132"/>
    </g>

    <rect class="box-soft" x="92" y="330" width="285" height="108"/>
    <text class="head" x="126" y="368">Jumper array L</text>
    <text class="small" x="126" y="397">select current from D1-D8</text>
    <circle class="dot-adc" cx="130" cy="424" r="5"/><circle class="dot-adc" cx="164" cy="424" r="5"/><circle class="dot-adc" cx="198" cy="424" r="5"/><circle class="dot-adc" cx="232" cy="424" r="5"/><circle class="dot-adc" cx="266" cy="424" r="5"/><circle class="dot-adc" cx="300" cy="424" r="5"/><circle class="dot-adc" cx="334" cy="424" r="5"/>
    <line class="rail-adc" x1="110" y1="317" x2="650" y2="317"/>
    <line class="rail-adc" x1="235" y1="330" x2="235" y2="317"/>

    <g transform="translate(470 330)">
      <use href="#tia" x="0" y="0"/>
      <text class="mono" x="30" y="116">TIA_L1</text>
      <line class="adc-line" x1="98" y1="40" x2="205" y2="40"/>
    </g>
    <g transform="translate(470 435)">
      <use href="#tia" x="0" y="0"/>
      <text class="mono" x="30" y="116">TIA_L2</text>
      <line class="adc-line" x1="98" y1="40" x2="205" y2="40"/>
    </g>
  </g>

  <g id="right-bank" transform="translate(1005 420)">
    <rect class="bank-right" x="0" y="0" width="800" height="520"/>
    <text class="head" x="28" y="42">RIGHT BANK · D9-D16</text>
    <text class="small" x="28" y="70">DAC2 drives shared VG1_R. Device A_i and μ_i are programmed individually.</text>

    <rect class="tag-dac" x="28" y="100" width="130" height="42"/>
    <text class="mono" x="52" y="127">VG1_R</text>
    <line class="rail-dac" x1="158" y1="121" x2="715" y2="121"/>

    <line class="rail-prog" x1="48" y1="168" x2="715" y2="168"/>
    <text class="mono-muted" x="52" y="158">A_i / μ_i program bus</text>

    <g transform="translate(70 185)">
      <use href="#gaussian-device" x="0" y="0"/><text class="mono" x="28" y="103">D9</text>
      <use href="#gaussian-device" x="88" y="0"/><text class="mono" x="112" y="103">D10</text>
      <use href="#gaussian-device" x="176" y="0"/><text class="mono" x="200" y="103">D11</text>
      <use href="#gaussian-device" x="264" y="0"/><text class="mono" x="288" y="103">D12</text>
      <use href="#gaussian-device" x="352" y="0"/><text class="mono" x="376" y="103">D13</text>
      <use href="#gaussian-device" x="440" y="0"/><text class="mono" x="464" y="103">D14</text>
      <use href="#gaussian-device" x="528" y="0"/><text class="mono" x="552" y="103">D15</text>
      <use href="#gaussian-device" x="616" y="0"/><text class="mono" x="640" y="103">D16</text>
      <line class="rail-adc" x1="43" y1="82" x2="43" y2="132"/>
      <line class="rail-adc" x1="131" y1="82" x2="131" y2="132"/>
      <line class="rail-adc" x1="219" y1="82" x2="219" y2="132"/>
      <line class="rail-adc" x1="307" y1="82" x2="307" y2="132"/>
      <line class="rail-adc" x1="395" y1="82" x2="395" y2="132"/>
      <line class="rail-adc" x1="483" y1="82" x2="483" y2="132"/>
      <line class="rail-adc" x1="571" y1="82" x2="571" y2="132"/>
      <line class="rail-adc" x1="659" y1="82" x2="659" y2="132"/>
    </g>

    <rect class="box-soft" x="92" y="330" width="285" height="108"/>
    <text class="head" x="126" y="368">Jumper array R</text>
    <text class="small" x="126" y="397">select current from D9-D16</text>
    <circle class="dot-adc" cx="130" cy="424" r="5"/><circle class="dot-adc" cx="164" cy="424" r="5"/><circle class="dot-adc" cx="198" cy="424" r="5"/><circle class="dot-adc" cx="232" cy="424" r="5"/><circle class="dot-adc" cx="266" cy="424" r="5"/><circle class="dot-adc" cx="300" cy="424" r="5"/><circle class="dot-adc" cx="334" cy="424" r="5"/>
    <line class="rail-adc" x1="110" y1="317" x2="650" y2="317"/>
    <line class="rail-adc" x1="235" y1="330" x2="235" y2="317"/>

    <g transform="translate(470 330)">
      <use href="#tia" x="0" y="0"/>
      <text class="mono" x="30" y="116">TIA_R1</text>
      <line class="adc-line" x1="98" y1="40" x2="205" y2="40"/>
    </g>
    <g transform="translate(470 435)">
      <use href="#tia" x="0" y="0"/>
      <text class="mono" x="30" y="116">TIA_R2</text>
      <line class="adc-line" x1="98" y1="40" x2="205" y2="40"/>
    </g>
  </g>

  <!-- route from top control to banks: subdued, small arrows -->
  <path class="dac-line" d="M 1280 254 V 334 H 765 V 420"/>
  <path class="dac-line" d="M 1280 254 V 334 H 1596 V 420"/>
  <path class="prog-line" d="M 1218 315 V 374 H 510 V 420"/>
  <path class="prog-line" d="M 1218 315 V 374 H 1432 V 420"/>

  <!-- SAADC and readout -->
  <rect class="box" x="822" y="970" width="260" height="70"/>
  <text class="head" x="885" y="1000">nRF SAADC</text>
  <text class="small" x="858" y="1024">AIN0-3 from four TIAs</text>
  <path class="adc-line" d="M 766 795 H 820 V 970 H 878"/>
  <path class="adc-line" d="M 766 900 H 836 V 990 H 905"/>
  <path class="adc-line" d="M 1675 795 H 1440 V 970 H 1030"/>
  <path class="adc-line" d="M 1675 900 H 1418 V 1000 H 1082"/>
  <path class="uart-line" d="M 1082 1005 H 1195"/>
  <text class="small" x="1210" y="1012">UART response</text>

  <!-- command examples -->
  <rect class="paper" x="118" y="976" width="585" height="72"/>
  <text class="mono" x="144" y="1008">D1,code → VG1_L  |  D2,code → VG1_R</text>
  <text class="mono" x="144" y="1032">A5/M5 → left D5  |  A12/M12 → right D12  |  ADC → TIA read</text>

  <!-- Legend -->
  <g transform="translate(1260 984)">
    <line class="uart-line" x1="0" y1="0" x2="62" y2="0"/><text class="small" x="78" y="6">UART</text>
    <line class="dac-line" x1="170" y1="0" x2="232" y2="0"/><text class="small" x="248" y="6">VG1 DAC</text>
    <line class="prog-line" x1="372" y1="0" x2="434" y2="0"/><text class="small" x="450" y="6">A/μ program</text>
    <line class="adc-line" x1="0" y1="38" x2="62" y2="38"/><text class="small" x="78" y="44">TIA / ADC</text>
  </g>
</svg>
