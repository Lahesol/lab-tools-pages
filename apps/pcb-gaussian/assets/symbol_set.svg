<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280">
  <defs>
    <style>
      .bg { fill: #f6f9f8; }
      .sheet { fill: #ffffff; stroke: #d9e4e2; stroke-width: 2; }
      .sym { fill: #ffffff; stroke: #17323a; stroke-width: 2.4; }
      .sym-soft { fill: #f7faf9; stroke: #2d5c64; stroke-width: 2.2; }
      .pin { stroke: #17323a; stroke-width: 2.2; stroke-linecap: round; }
      .pin-dac { stroke: #f4a261; stroke-width: 3; stroke-linecap: round; }
      .pin-prog { stroke: #d1495b; stroke-width: 3; stroke-linecap: round; }
      .pin-adc { stroke: #2a9d8f; stroke-width: 3; stroke-linecap: round; }
      .pin-uart { stroke: #2d5c64; stroke-width: 3; stroke-linecap: round; }
      .title { font-family: Malgun Gothic, Segoe UI, Arial, sans-serif; font-size: 42px; font-weight: 800; fill: #17323a; }
      .subtitle { font-family: Malgun Gothic, Segoe UI, Arial, sans-serif; font-size: 22px; fill: #66737a; }
      .name { font-family: Malgun Gothic, Segoe UI, Arial, sans-serif; font-size: 27px; font-weight: 800; fill: #17323a; }
      .desc { font-family: Malgun Gothic, Segoe UI, Arial, sans-serif; font-size: 18px; fill: #66737a; }
      .pintext { font-family: Cascadia Mono, Consolas, monospace; font-size: 18px; fill: #172126; }
      .pintext-small { font-family: Cascadia Mono, Consolas, monospace; font-size: 15px; fill: #172126; }
      .tag { font-family: Malgun Gothic, Segoe UI, Arial, sans-serif; font-size: 16px; font-weight: 800; fill: #ffffff; }
      .note { font-family: Malgun Gothic, Segoe UI, Arial, sans-serif; font-size: 18px; fill: #172126; }
      .legend { font-family: Malgun Gothic, Segoe UI, Arial, sans-serif; font-size: 17px; fill: #66737a; }
      .op { fill: #ffffff; stroke: #17323a; stroke-width: 2.5; }
      .rail { stroke: #66737a; stroke-width: 2; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1280"/>
  <text class="title" x="70" y="82">PCB Gaussian route overlay symbol set</text>
  <text class="subtitle" x="72" y="122">Datasheet/netlist 기반 simplified schematic symbols - 실제 회로도 overlay용 초안</text>

  <rect class="sheet" x="52" y="160" width="1696" height="1030" rx="18"/>

  <!-- Legend -->
  <rect x="112" y="196" width="110" height="30" rx="15" fill="#2d5c64"/>
  <text class="tag" x="132" y="218">UART</text>
  <rect x="244" y="196" width="110" height="30" rx="15" fill="#f4a261"/>
  <text class="tag" x="269" y="218">DAC</text>
  <rect x="376" y="196" width="130" height="30" rx="15" fill="#d1495b"/>
  <text class="tag" x="397" y="218">PROGRAM</text>
  <rect x="528" y="196" width="110" height="30" rx="15" fill="#2a9d8f"/>
  <text class="tag" x="557" y="218">ADC</text>
  <text class="legend" x="670" y="218">색이 들어간 pin은 route highlight에서 직접 쓰는 신호입니다.</text>

  <!-- nRF52832 -->
  <g transform="translate(110 280)">
    <rect class="sym" x="0" y="0" width="300" height="320" rx="14"/>
    <text class="name" x="82" y="48">nRF52832</text>
    <text class="desc" x="72" y="78">MCU / UART / SPI / SAADC</text>

    <line class="pin-uart" x1="-62" y1="108" x2="0" y2="108"/>
    <text class="pintext" x="16" y="114">P0.24 TX</text>
    <line class="pin-uart" x1="-62" y1="144" x2="0" y2="144"/>
    <text class="pintext" x="16" y="150">P0.23 RX</text>

    <line class="pin-prog" x1="300" y1="104" x2="362" y2="104"/>
    <text class="pintext" x="168" y="110">SCLK_T</text>
    <line class="pin-prog" x1="300" y1="140" x2="362" y2="140"/>
    <text class="pintext" x="182" y="146">DIN_T</text>
    <line class="pin-prog" x1="300" y1="176" x2="362" y2="176"/>
    <text class="pintext" x="202" y="182">SA/SB/SC</text>
    <line class="pin-prog" x1="300" y1="212" x2="362" y2="212"/>
    <text class="pintext" x="214" y="218">SE/SE1</text>

    <line class="pin-dac" x1="300" y1="52" x2="362" y2="52"/>
    <text class="pintext" x="186" y="58">SCLK/DIN</text>
    <line class="pin-dac" x1="300" y1="76" x2="362" y2="76"/>
    <text class="pintext" x="220" y="82">SYNC</text>

    <line class="pin-adc" x1="-62" y1="218" x2="0" y2="218"/>
    <text class="pintext" x="16" y="224">AIN0-3</text>
    <line class="pin-adc" x1="-62" y1="252" x2="0" y2="252"/>
    <text class="pintext" x="16" y="258">AIN4-7</text>

    <text class="desc" x="38" y="298">route controller</text>
  </g>

  <!-- AD5322 -->
  <g transform="translate(590 280)">
    <rect class="sym" x="0" y="0" width="280" height="260" rx="14"/>
    <text class="name" x="82" y="48">AD5322</text>
    <text class="desc" x="66" y="78">dual 12-bit DAC</text>

    <line class="pin-dac" x1="-58" y1="48" x2="0" y2="48"/>
    <text class="pintext" x="16" y="54">~SYNC</text>
    <line class="pin-dac" x1="-58" y1="84" x2="0" y2="84"/>
    <text class="pintext" x="16" y="90">SCLK</text>
    <line class="pin-dac" x1="-58" y1="120" x2="0" y2="120"/>
    <text class="pintext" x="16" y="126">DIN</text>

    <line class="pin" x1="-58" y1="172" x2="0" y2="172"/>
    <text class="pintext" x="16" y="178">VREFA/B</text>
    <line class="pin-dac" x1="280" y1="84" x2="338" y2="84"/>
    <text class="pintext" x="158" y="90">VOUTA</text>
    <line class="pin-dac" x1="280" y1="128" x2="338" y2="128"/>
    <text class="pintext" x="158" y="134">VOUTB</text>

    <line class="pin" x1="84" y1="-42" x2="84" y2="0"/>
    <text class="pintext-small" x="54" y="-52">VDD</text>
    <line class="pin" x1="196" y1="260" x2="196" y2="302"/>
    <text class="pintext-small" x="174" y="326">GND</text>
  </g>

  <!-- REF symbols -->
  <g transform="translate(1000 260)">
    <rect class="sym-soft" x="0" y="0" width="190" height="120" rx="14"/>
    <text class="name" x="42" y="45">REF194</text>
    <text class="desc" x="50" y="76">4.5 V DAC ref</text>
    <line class="pin" x1="-50" y1="60" x2="0" y2="60"/>
    <text class="pintext-small" x="-96" y="66">VIN</text>
    <line class="pin-dac" x1="190" y1="60" x2="240" y2="60"/>
    <text class="pintext-small" x="204" y="52">VREF</text>
  </g>
  <g transform="translate(1000 430)">
    <rect class="sym-soft" x="0" y="0" width="190" height="120" rx="14"/>
    <text class="name" x="42" y="45">REF193</text>
    <text class="desc" x="44" y="76">3.0 V digipot ref</text>
    <line class="pin" x1="-50" y1="60" x2="0" y2="60"/>
    <text class="pintext-small" x="-96" y="66">VIN</text>
    <line class="pin-prog" x1="190" y1="60" x2="240" y2="60"/>
    <text class="pintext-small" x="204" y="52">VREF</text>
  </g>

  <!-- MAX4581 -->
  <g transform="translate(110 720)">
    <rect class="sym" x="0" y="0" width="300" height="330" rx="14"/>
    <text class="name" x="82" y="48">MAX4581</text>
    <text class="desc" x="68" y="78">8:1 analog mux / CS select</text>

    <line class="pin-prog" x1="-58" y1="106" x2="0" y2="106"/>
    <text class="pintext" x="16" y="112">SA</text>
    <line class="pin-prog" x1="-58" y1="142" x2="0" y2="142"/>
    <text class="pintext" x="16" y="148">SB</text>
    <line class="pin-prog" x1="-58" y1="178" x2="0" y2="178"/>
    <text class="pintext" x="16" y="184">SC</text>
    <line class="pin-prog" x1="-58" y1="226" x2="0" y2="226"/>
    <text class="pintext" x="16" y="232">ENABLE</text>

    <line class="pin-prog" x1="300" y1="106" x2="358" y2="106"/>
    <text class="pintext" x="214" y="112">X0-X7</text>
    <line class="pin-prog" x1="300" y1="160" x2="358" y2="160"/>
    <text class="pintext" x="238" y="166">A/B</text>
    <line class="pin-prog" x1="300" y1="214" x2="358" y2="214"/>
    <text class="pintext" x="206" y="220">CS bus</text>

    <text class="desc" x="62" y="294">SE or SE1 group</text>
  </g>

  <!-- MAX5488 -->
  <g transform="translate(590 680)">
    <rect class="sym" x="0" y="0" width="330" height="430" rx="14"/>
    <text class="name" x="96" y="48">MAX5488</text>
    <text class="desc" x="74" y="78">dual 256-tap digital pot</text>

    <line class="pin-prog" x1="-58" y1="104" x2="0" y2="104"/>
    <text class="pintext" x="16" y="110">SCLK</text>
    <line class="pin-prog" x1="-58" y1="140" x2="0" y2="140"/>
    <text class="pintext" x="16" y="146">DIN</text>
    <line class="pin-prog" x1="-58" y1="176" x2="0" y2="176"/>
    <text class="pintext" x="16" y="182">~CS</text>

    <line class="pin" x1="-58" y1="230" x2="0" y2="230"/>
    <text class="pintext" x="16" y="236">VDD</text>
    <line class="pin" x1="-58" y1="266" x2="0" y2="266"/>
    <text class="pintext" x="16" y="272">GND/EP</text>

    <line class="pin-prog" x1="330" y1="106" x2="388" y2="106"/>
    <text class="pintext" x="236" y="112">HA</text>
    <line class="pin-prog" x1="330" y1="142" x2="388" y2="142"/>
    <text class="pintext" x="236" y="148">WA</text>
    <line class="pin-prog" x1="330" y1="178" x2="388" y2="178"/>
    <text class="pintext" x="238" y="184">LA</text>
    <line class="pin-prog" x1="330" y1="248" x2="388" y2="248"/>
    <text class="pintext" x="236" y="254">HB</text>
    <line class="pin-prog" x1="330" y1="284" x2="388" y2="284"/>
    <text class="pintext" x="236" y="290">WB</text>
    <line class="pin-prog" x1="330" y1="320" x2="388" y2="320"/>
    <text class="pintext" x="238" y="326">LB</text>

    <path d="M 80 126 L 160 126 L 160 194 L 250 194" fill="none" stroke="#d1495b" stroke-width="2.4"/>
    <path d="M 80 264 L 160 264 L 160 332 L 250 332" fill="none" stroke="#d1495b" stroke-width="2.4"/>
    <text class="desc" x="82" y="388">A/mu wiper write</text>
  </g>

  <!-- DAC amplifier -->
  <g transform="translate(1280 250)">
    <polygon class="op" points="0,0 0,160 190,80"/>
    <line class="pin-dac" x1="-62" y1="54" x2="0" y2="54"/>
    <text class="pintext" x="-130" y="60">VOUTA/B</text>
    <line class="pin-dac" x1="190" y1="80" x2="252" y2="80"/>
    <text class="pintext" x="204" y="72">G1 / Vhigh</text>
    <text class="pintext" x="28" y="70">+</text>
    <text class="pintext" x="28" y="112">-</text>
    <text class="name" x="46" y="206">DAC amp</text>
    <text class="desc" x="44" y="236">gain = 4.5x</text>
  </g>

  <!-- A / mu amplifier -->
  <g transform="translate(1280 540)">
    <polygon class="op" points="0,0 0,160 190,80"/>
    <line class="pin-prog" x1="-62" y1="54" x2="0" y2="54"/>
    <text class="pintext" x="-112" y="60">WA/WB</text>
    <line class="pin-prog" x1="190" y1="80" x2="252" y2="80"/>
    <text class="pintext" x="204" y="72">A_out / mu_out</text>
    <text class="pintext" x="28" y="70">+</text>
    <text class="pintext" x="28" y="112">-</text>
    <text class="name" x="22" y="206">A / mu amp</text>
    <text class="desc" x="20" y="236">A=-6x, mu=-2x</text>
  </g>

  <!-- Device cell -->
  <g transform="translate(1080 830)">
    <rect class="sym-soft" x="0" y="0" width="250" height="170" rx="14"/>
    <text class="name" x="60" y="46">RRAM cell</text>
    <text class="desc" x="36" y="76">Gaussian device element</text>
    <line class="pin-dac" x1="-58" y1="60" x2="0" y2="60"/>
    <text class="pintext" x="18" y="66">G1 / G2</text>
    <line class="pin-prog" x1="-58" y1="112" x2="0" y2="112"/>
    <text class="pintext" x="18" y="118">A / mu</text>
    <line class="pin-adc" x1="250" y1="86" x2="308" y2="86"/>
    <text class="pintext" x="168" y="92">I_sum</text>
    <path d="M 72 122 h 28 l 12 -34 l 20 68 l 20 -68 l 12 34 h 28" fill="none" stroke="#d1495b" stroke-width="2.5"/>
  </g>

  <!-- TIA -->
  <g transform="translate(1470 800)">
    <polygon class="op" points="0,0 0,180 210,90"/>
    <line class="pin-adc" x1="-62" y1="90" x2="0" y2="90"/>
    <text class="pintext" x="-130" y="96">I_sum</text>
    <line class="pin-adc" x1="210" y1="90" x2="272" y2="90"/>
    <text class="pintext" x="222" y="82">AIN0-3</text>
    <text class="pintext" x="30" y="78">-</text>
    <text class="pintext" x="30" y="126">+</text>
    <path d="M 70 28 h 86" class="rail"/>
    <path d="M 76 28 v -38 h 72 v 38" fill="none" stroke="#66737a" stroke-width="2"/>
    <text class="pintext-small" x="77" y="-22">Rf 1M</text>
    <text class="name" x="66" y="226">TIA</text>
  </g>

  <!-- Source note -->
  <rect class="sheet" x="88" y="1125" width="1624" height="46" rx="10"/>
  <text class="note" x="112" y="1154">Note: 이 symbol set은 control route 설명용 simplified symbol입니다. AD5322/MAX4581/MAX5488 pin names는 현재 KiCad/netlist와 datasheet naming을 기준으로 정리했습니다.</text>
</svg>
